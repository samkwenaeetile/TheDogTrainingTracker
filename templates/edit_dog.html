{% extends "base.html" %}

{% block title %}Edit Dog{% endblock %}

{% block content %}

<h2>Edit Dog Profile</h2>

<form action="/update-dog/{{ dog['dog_id'] }}" method="POST">

    <label for="dog_name">Dog Name</label><br>
    <input type="text" id="dog_name" name="dog_name"
           value="{{ dog['dog_name'] }}" required><br><br>

    <label for="breed">Breed</label><br>
    <input type="text" id="breed" name="breed"
           value="{{ dog['breed'] }}" required><br><br>

    <label for="age">Age</label><br>
    <input type="number" id="age" name="age"
           value="{{ dog['age'] }}"
           min="0" max="30" required><br><br>

    <label for="owner">Owner Name</label><br>
    <input type="text" id="owner" name="owner"
           value="{{ dog['owner_name'] }}" required><br><br>

    <button type="submit">Update Dog</button>

</form>

{% endblock %}
